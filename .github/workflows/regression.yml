name: Regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trip_ci
          # Disposable service credential; never use this outside CI.
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: trip_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trip_ci -d trip_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://trip_ci:ci_only_password@127.0.0.1:5432/trip_ci
      TEST_DATABASE_URL: postgresql+asyncpg://trip_ci:ci_only_password@127.0.0.1:5432/trip_ci
      AGENT_DB_TESTS: "1"
      SMS_PROVIDER: disabled
      ALIYUN_SMS_ENABLED: "false"
      AMAP_API_KEY: ""
      AMAP_JS_KEY: ""
      AMAP_JS_SECURITY_CODE: ""
      LLM_API_KEY: ""
      LLM_MODEL: ""
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Migrate disposable database
        run: python -m alembic upgrade head
      - name: Python syntax
        run: python -m compileall -q app tests scripts migrations test_e2e.py
      - name: JavaScript syntax
        run: python scripts/check_frontend.py
      - name: Unit, PostgreSQL, crash recovery and HTTP E2E
        run: python -m unittest discover -s tests -q
      - name: Patch whitespace
        run: git diff --check
